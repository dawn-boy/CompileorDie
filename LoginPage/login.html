<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compile or Die</title>
    <style>
        html, body {
            overflow: hidden; /* Disables scrolling */
        }
        body {
            background-image: url('img/LoginPageBackground.png'); /* Replace with your image URL */
            background-size: cover; /* Makes the image cover the entire screen */
            background-position: center; /* Centers the image */
            background-repeat: no-repeat; /* Prevents tiling */
            height: 100vh; /* Ensures full height */
            margin: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
            font-family: 'MyCustomFont', sans-serif;
        }
        @font-face {
            font-family: 'MyCustomFont';
            src: url('fonts/PixelOperator8.woff2') format('woff2'),
            url('fonts/PixelOperator8.woff') format('woff'),
            url('fonts/PixelOperator8.ttf') format('truetype');
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        input {
            font-family: 'MyCustomFont', sans-serif; /* Ensure your font is correctly loaded */
            font-size: 12px;
            color: white; /* White text */
            background-color: #121516; /* Black background */
            border: 2px solid #3E3C3B; /* White border */
            width: 285px; /* Adjust based on your layout */
            height: 35px;
            text-align: center;
            outline: none; /* Removes default outline */
            transition: 0.5s ease-in-out;
            margin-bottom: 25px;
        }

        button {
            font-family: 'MyCustomFont', sans-serif;
            padding: 10px 20px;
            font-size: 12px;
            background-color: #00009A;
            color: white;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            transition: 0.5s;
            width: 385px;
        }

        button:hover {
            background-color: #0000d7;
        }
        .left{
            margin-right: 50px;
        }
        .right{
            margin-left: 50px;
        }
        .title {
            font-family: 'MyCustomFont', sans-serif;
            font-size: 24px;
            font-weight: bold;
            color: #989698;
            text-transform: uppercase;
            text-align: center;
            position: absolute;
            top: 120px; /* Moves it to the top */
            left: 50%;
            transform: translateX(-50%); /* Centers it horizontally */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Login Interface</h1>
        <div class="grid">
            <input class="left" type="text" placeholder="Username">
            <input class="right" type="text" placeholder="Password">
            <input class="left" type="text" placeholder="Nickname">
            <input class="right" type="text" placeholder="TeamCode">
        </div>
        <button>Submit</button>
    </div>
</body>
</html>
