<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Compile Or Die</title>
</head>
<body>
    
    <div class="hero is-dark is-fullheight">
        <div class="hero-body">
            <div class="container">
                <h1 class="title has-text-centered has-text-light">Login Interface</h1> 
                <div class="columns is-centered">
                    <div class="column is-4">
                        <form action="" class="box">
                            <div class="field">
                                <label class="label has-text-link">User Name</label>
                                <div class="control has-icons-left">
                                    <input type="text" class="input is-medium" placeholder="Enter your username">
                                    <span class="icon is-small is-left">
                                        <i class="fa fa-user"></i>
                                    </span>
                                </div>
                            </div>
                            <div class="field">
                                <label class="label has-text-success">Password</label>
                                <div class="control has-icons-left">
                                    <input type="password" class="input is-medium" placeholder="******">
                                    <span class="icon is-small is-left">
                                        <i class="fa fa-lock"></i>
                                    </span>
                                </div>
                            </div>
                            <div class="field">
                                <label class="label has-text-warning">Alias Name</label>
                                <div class="control has-icons-left">
                                    <input type="text" class="input is-medium" placeholder="Batman">
                                    <span class="icon is-small is-left">
                                        <i class="fa fa-user-secret"></i> <!-- Incognito icon -->
                                    </span>
                                </div>
                            </div>
                            <div class="field">
                                <label class="label has-text-danger">Team Code</label>
                                <div class="control has-icons-left">
                                    <input type="text" class="input is-medium" placeholder="DY4HK5">
                                    <span class="icon is-small is-left">
                                        <i class="fa fa-code"></i>
                                    </span>
                                </div>
                            </div>
                            <div class="field">
                                <div class="control">
                                    <button class="button is-info is-medium is-fullwidth">Login</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
